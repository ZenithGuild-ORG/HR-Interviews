name: I'm interested in this position
description: Apply for the ZenithGuild senior developer role
title: "I'm interested in this position"
labels: ["application", "apply", "bug", "candidate", "consulting", "contract", "documentation", "duplicate", enhancement", "feature", "full-time", "good first issue", "help wanted", "hiring", "interview", "invalid", "job", "job-discussion", "jobs", "maintenance", "open role", "opportunity", "part-time", "position", "question", "recruiting", "refactor", "remote", "software-development", "talent", "task"]
body:
  - type: markdown
    attributes:
      value: |
        ### Senior Software Engineer — client-facing

        Remote · CET/EST · $60/hr · Part-time or full-time

        Fill in the fields below and submit. We read every application.

  - type: input
    id: name
    attributes:
      label: Your Name
      description: Please enter your name
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Email
      description: Where we should reply
      placeholder: you@example.com
    validations:
      required: true

  - type: input
    id: links
    attributes:
      label: Portfolio / LinkedIn / GitHub
      description: Links to your work, comma separated
    validations:
      required: false

  - type: dropdown
    id: timezone
    attributes:
      label: Which timezone do you work in?
      options:
        - CET (or within 2 hours of it)
        - EST (or within 2 hours of it)
        - Neither
    validations:
      required: true
